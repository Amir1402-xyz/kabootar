name: build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Rust targets and cargo-ndk
        run: |
          rustup target add aarch64-linux-android armv7-linux-androideabi
          cargo install cargo-ndk --locked

      - name: Build native core from source
        run: |
          export ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          cargo ndk -t arm64-v8a  --platform 24 -o app/src/main/jniLibs build --release
          cargo ndk -t armeabi-v7a --platform 21 -o app/src/main/jniLibs build --release
          for abi in arm64-v8a armeabi-v7a; do
            f="app/src/main/jniLibs/$abi/libtgwsproxy.so"
            test -s "$f" || { echo "missing $f"; exit 1; }
            file "$f"
          done
          file app/src/main/jniLibs/arm64-v8a/libtgwsproxy.so | grep -q "ARM aarch64"
          file app/src/main/jniLibs/armeabi-v7a/libtgwsproxy.so | grep -q "ARM, EABI5"

      - name: Signing setup
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_B64" || { echo "signing secrets missing"; exit 1; }
          echo "$KEYSTORE_B64" | base64 -d > release.keystore
          {
            echo "sdk.dir=$ANDROID_HOME"
            echo "KEYSTORE_FILE=../release.keystore"
            echo "KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
            echo "KEY_ALIAS=$KEY_ALIAS"
            echo "KEY_PASSWORD=$KEY_PASSWORD"
          } > local.properties

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.1.0"

      - name: Build APKs
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Collect
        run: |
          set -e
          V="${GITHUB_REF_NAME}"
          case "$V" in v*) ;; *) V="dev-${GITHUB_SHA::7}";; esac
          mkdir -p out
          cp app/build/outputs/apk/universal/release/app-universal-release.apk "out/Kabootar-$V-universal.apk"
          cp app/build/outputs/apk/arm64/release/app-arm64-release.apk        "out/Kabootar-$V-arm64-v8a.apk"
          cp app/build/outputs/apk/arm32/release/app-arm32-release.apk        "out/Kabootar-$V-armeabi-v7a.apk"
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          for f in out/*.apk; do
            "$APKSIGNER" verify --print-certs "$f" | grep -q "CN=Kabootar" || { echo "$f not signed with the release key"; exit 1; }
          done
          (cd out && sha256sum *.apk > SHA256SUMS.txt)
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: kabootar-apks
          path: out/*

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PRE=""
          case "$GITHUB_REF_NAME" in *-rc*|*-beta*) PRE="--prerelease";; esac
          gh release create "$GITHUB_REF_NAME" out/* --title "کبوتر $GITHUB_REF_NAME" --notes-file .github/release-notes.md $PRE
